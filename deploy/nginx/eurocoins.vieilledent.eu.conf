# EuroCoins — site statique : https://eurocoins.vieilledent.eu
#
# Installation sur le VPS (voir README, section Déploiement) :
#   sudo cp deploy/nginx/eurocoins.vieilledent.eu.conf /etc/nginx/sites-available/eurocoins.vieilledent.eu
#   sudo ln -s ../sites-available/eurocoins.vieilledent.eu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d eurocoins.vieilledent.eu --redirect
#
# Ce fichier reflète l'état en production APRÈS certbot (blocs « managed by Certbot »).
# Pour une installation neuve, retirer ces lignes, garder « listen 80 » dans le premier bloc,
# puis lancer certbot qui les rajoutera.
#
# Fichiers servis directement depuis /var/www/eurocoins/current (lien vers la dernière
# version déployée par GitHub Actions) : ni conteneur ni port, aucun conflit avec les
# autres projets du serveur.

server {
    server_name eurocoins.vieilledent.eu;

    root /var/www/eurocoins/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JS/CSS avec empreinte dans le nom : cache permanent.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Photos des pièces : ne changent quasiment jamais.
    location /coins/ {
        expires 30d;
        try_files $uri =404;
    }

    # Textes BCE : mis à jour chaque semaine.
    location /i18n/ {
        expires 1d;
        try_files $uri =404;
    }

    # Manifeste d'application (installation sur l'écran d'accueil) : type MIME dédié.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html toujours revalidé, pour prendre la nouvelle version dès le déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eurocoins.vieilledent.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eurocoins.vieilledent.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP → HTTPS
server {
    if ($host = eurocoins.vieilledent.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name eurocoins.vieilledent.eu;
    return 404; # managed by Certbot
}
